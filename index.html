<!DOCTYPE html>
<!-- ============================================================
     PORTAL TP ADMINISTRACIÓN — Página principal (estudiantes)
     ============================================================
     CÓMO EDITAR ESTE SITIO (resumen rápido):
     - Textos, asignaturas, archivos, enlaces y avisos  →  js/datos.js
     - Colores y tipografía                             →  css/estilos.css (variables al inicio)
     - Estructura de las pantallas                      →  js/app.js
     - Panel de administración                          →  admin.html
     Casi nunca necesitarás tocar este archivo.
     ============================================================ -->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portal de asignaturas de la especialidad de Administración. Materiales, guías, tareas y fechas de evaluación.">
  <title>Portal TP Administración</title>
  <link rel="stylesheet" href="css/estilos.css">
  <!-- Ícono de la pestaña del navegador (emoji como favicon, sin archivos extra) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
</head>
<body>

  <!-- Enlace de accesibilidad: permite saltar la navegación con teclado -->
  <a class="saltar-contenido" href="#contenido">Saltar al contenido principal</a>

  <!-- ===== ENCABEZADO con navegación principal ===== -->
  <header class="encabezado">
    <div class="contenedor encabezado__interior">
      <a href="#/inicio" class="marca" aria-label="Ir al inicio">
        <!-- LOGOS DEL COLEGIO Y DEL TP:
             Sube tus imágenes a la carpeta img/ con estos nombres exactos:
               img/logo-colegio.png   (escudo Colegio Cardenal Caro)
               img/logo-tp.png        (logo Técnicos Profesionales de Excelencia)
             Si los archivos no existen, los logos simplemente no se muestran
             (gracias al onerror) y el sitio sigue funcionando normal. -->
        <img class="marca__logo" src="img/logo-colegio.png" alt="Colegio Cardenal Caro" onerror="this.style.display='none'">
        <img class="marca__logo" src="img/logo-tp.png" alt="Técnicos Profesionales de Excelencia — Fundación Belén Educa" onerror="this.style.display='none'">
        <span class="marca__texto" id="marca-nombre">Portal TP Administración</span>
      </a>

      <!-- Botón menú para celulares -->
      <button class="boton-menu" id="boton-menu" aria-label="Abrir menú de navegación" aria-expanded="false">☰</button>

      <nav class="navegacion" id="navegacion" aria-label="Navegación principal">
        <a href="#/inicio">Inicio</a>
        <a href="#/avisos">Avisos</a>
        <a href="#/calendario">Calendario</a>
        <a href="#/preguntas">Preguntas frecuentes</a>
        <!-- Botón para activar/desactivar el modo oscuro -->
        <button id="boton-tema" class="boton-tema" aria-label="Cambiar entre modo claro y oscuro">🌙</button>
      </nav>
    </div>
  </header>

  <!-- ===== BUSCADOR GLOBAL ===== -->
  <div class="barra-busqueda">
    <div class="contenedor">
      <form id="formulario-busqueda" role="search" aria-label="Buscar en el portal">
        <input type="search" id="campo-busqueda" placeholder="Buscar guías, tareas, clases o temas… (ej: hojas de cálculo)"
               aria-label="Buscar materiales, tareas o temas">
        <button type="submit" aria-label="Buscar">🔍 Buscar</button>
      </form>
    </div>
  </div>

  <!-- ===== CONTENIDO PRINCIPAL =====
       JavaScript (js/app.js) dibuja aquí cada pantalla según la dirección:
       #/inicio · #/asignatura/gct · #/avisos · #/calendario · #/preguntas · #/buscar/texto -->
  <main id="contenido" class="contenedor" tabindex="-1"></main>

  <!-- ===== PIE DE PÁGINA ===== -->
  <footer class="pie">
    <div class="contenedor">
      <p id="pie-texto">Portal de la especialidad de Administración.</p>
      <p class="pie__admin"><a href="admin.html">Acceso docente</a></p>
    </div>
  </footer>

  <!-- Los datos (asignaturas, recursos, avisos…) viven en datos.js.
       app.js los lee y construye las pantallas. El orden importa. -->
  <script src="js/datos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
